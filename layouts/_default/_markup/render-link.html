{{- $link := (partial "functions/get-resource.html" .Destination) | safeURL -}}

<a href="{{ $link }}"
    {{- with .Title -}}
    title="{{ . }}"
    {{- end }}
    {{- if or (strings.HasPrefix .Destination "http:") (strings.HasPrefix .Destination "https:") }} target="_blank"{{ end }}>
    {{- .Text | safeHTML -}}
</a>
